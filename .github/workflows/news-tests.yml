name: News workflow checks
on:
  pull_request:
    paths: ['src/news/**', 'tests/**', 'requirements-news.txt', '.github/workflows/news-tests.yml']
  push:
    branches: ['feat/news-source-filtering']
    paths: ['src/news/**', 'tests/**', 'requirements-news.txt', '.github/workflows/news-tests.yml']
permissions:
  contents: read
jobs:
  news-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: news
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEWS_TEST_DATABASE_URL: 'host=localhost port=5432 dbname=news user=news password=news-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-news.txt
      - run: python -m pip install -r requirements-news.txt
      - run: python -m unittest discover -s tests -v
