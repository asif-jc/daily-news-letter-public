version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        exclude-patterns: [dagster]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    groups:
      github-actions:
        patterns: ['*']
