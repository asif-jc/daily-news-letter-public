[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news-reader"
version = "1.0.0"
description = "An evidence-first news workflow with retained decisions and a static reader."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.15.0",
  "feedparser==6.0.14",
  "python-dotenv==1.2.4",
  "requests==2.34.2",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
# Keep this aligned with the shared daemon; upgrade the deployment together.
orchestration = ["dagster==1.13.17"]

[project.scripts]
news = "news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news*"]

[tool.setuptools.package-data]
news = ["*.css", "*.js", "*.json", "migrations/*.sql", "assets/*.jpg", "assets/*.png"]
